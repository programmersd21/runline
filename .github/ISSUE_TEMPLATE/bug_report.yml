name: Bug report
description: Create a report to help us improve runline
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'runline'
        2. Press '...'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version Information
      description: Output of `runline --version` and `gh --version`.
    validations:
      required: true
  - type: textarea
    id: terminal
    attributes:
      label: Terminal Environment
      description: Terminal emulator (Kitty, Alacritty, Ghostty, WezTerm, etc.), OS, and shell.
