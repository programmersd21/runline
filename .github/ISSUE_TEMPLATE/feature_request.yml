name: Feature request
description: Suggest an idea or enhancement for runline
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting an idea to make runline even better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you considered.
